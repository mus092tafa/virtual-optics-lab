schema: spec-driven

context: |
  This is a virtual engineering optics laboratory, not an optics-themed animation.
  Every visual behavior must follow from a stated physical equation or optical principle;
  a physically impossible result is a defect even if it looks convincing.
  Configurations outside the models' validity must be reported, never guessed.
  All physics is in SI units and lives in src/physics/; UI components contain no optical formulas.

rules:
  proposal:
    - State the physical equation or principle behind each new behavior
  design:
    - List the model's assumptions and range of validity
  tasks:
    - Include unit tests against the analytical result and a docs/PHYSICS.md entry for new physics
    - End with a task to run each affected experiment in the app and check its numbers against the equations

# Project context (optional)
# Add only constraints that should guide OpenSpec artifacts and workflows.
# Include constraints an agent cannot infer by reading the code.
# Keep general project documentation and discoverable codebase facts out.
# Example:
#   context: |
#     Designs and tasks must cover Windows, macOS, and Linux
#     Write all artifacts in Spanish

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
