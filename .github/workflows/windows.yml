name: Windows builds

# Builds both editions as a portable exe and as an installer. The installer
# cannot be built on Linux without wine, so it is built here. A `v*` tag
# publishes the four files as a GitHub release; a manual run only keeps them
# as artifacts of the run.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check that the tag is the version in package.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::The tag is $GITHUB_REF_NAME but package.json says $version. Use 'npm version' to make both."
            exit 1
          fi
      - run: npm run build
      - run: npm run build:student
      - run: npx electron-builder --win portable nsis --x64 --config electron-builder.admin.json --publish never
      - run: npx electron-builder --win portable nsis --x64 --config electron-builder.student.json --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: virtual-optics-lab-windows
          path: |
            release/teacher/*.exe
            release/student/*.exe
          if-no-files-found: error
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'NOTES'
          For 64-bit Windows 10 and 11.

          | Edition | Installer | Single file, no installation |
          | --- | --- | --- |
          | **Teacher**: the laboratory, writing exams, the classroom, marking | `VirtualOpticsLab-Teacher-…-setup.exe` | `VirtualOpticsLab-Teacher-…-portable.exe` |
          | **Student**: the laboratory, joining and sitting exams | `VirtualOpticsLab-Student-…-setup.exe` | `VirtualOpticsLab-Student-…-portable.exe` |

          The installer needs no administrator rights and lets exam files be opened by double-clicking them. The files are not code-signed, so Windows SmartScreen asks for confirmation on first launch (*More info → Run anyway*).
          NOTES
          gh release create "$GITHUB_REF_NAME" release/teacher/*.exe release/student/*.exe --verify-tag --title "Virtual Optics Lab ${GITHUB_REF_NAME#v}" --notes-file notes.md --generate-notes
