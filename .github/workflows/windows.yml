name: Windows builds

# Builds both editions as a portable exe and as an installer. The installer
# cannot be built on Linux without wine, so it is built here. Every push to
# `main` (a merge of `develop`) publishes the four files as a GitHub release
# named after the version in package.json, which must therefore be new; a
# manual run only keeps them as artifacts of the run.
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Check that the version in package.json has not been released
        id: version
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          tag="v$(node -p "require('./package.json').version")"
          if [ -n "$(git ls-remote --tags origin "refs/tags/$tag")" ]; then
            echo "::error::$tag is already released. Raise the version on develop ('npm version minor --no-git-tag-version') before merging into main."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm run build
      - run: npm run build:student
      - run: npx electron-builder --win portable nsis --x64 --config electron-builder.admin.json --publish never
      - run: npx electron-builder --win portable nsis --x64 --config electron-builder.student.json --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: virtual-optics-lab-windows
          path: |
            release/teacher/*.exe
            release/student/*.exe
          if-no-files-found: error
      - name: Publish the release
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          cat > notes.md <<'NOTES'
          For 64-bit Windows 10 and 11.

          | Edition | Installer | Single file, no installation |
          | --- | --- | --- |
          | **Teacher**: the laboratory, writing exams, the classroom, marking | `VirtualOpticsLab-Teacher-…-setup.exe` | `VirtualOpticsLab-Teacher-…-portable.exe` |
          | **Student**: the laboratory, joining and sitting exams | `VirtualOpticsLab-Student-…-setup.exe` | `VirtualOpticsLab-Student-…-portable.exe` |

          The installer needs no administrator rights and lets exam files be opened by double-clicking them. The files are not code-signed, so Windows SmartScreen asks for confirmation on first launch (*More info → Run anyway*).
          NOTES
          # Creates the tag on the commit that was built.
          gh release create "$TAG" release/teacher/*.exe release/student/*.exe --target "$GITHUB_SHA" --title "Virtual Optics Lab ${TAG#v}" --notes-file notes.md --generate-notes
