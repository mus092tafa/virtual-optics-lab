name: Windows builds

# Builds both editions as a portable exe and as an installer. The installer
# cannot be built on Linux without wine, so it is built here.
on:
  workflow_dispatch:
  push:
    tags: ['v*']
    # On a branch, only a change to this file starts a build.
    branches: ['**']
    paths: ['.github/workflows/windows.yml']

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run build:student
      - run: npx electron-builder --win portable nsis --x64 --config electron-builder.admin.json --publish never
      - run: npx electron-builder --win portable nsis --x64 --config electron-builder.student.json --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: virtual-optics-lab-windows
          path: |
            release/teacher/*.exe
            release/student/*.exe
          if-no-files-found: error
