name: Windows builds

# Builds both editions as a portable exe and as an installer. The installer
# cannot be built on Linux without wine, so it is built here. Every push to
# `main` (a merge of `develop`) publishes the four files as a GitHub release.
# Its version is the one in package.json or, when that has been released
# already, the next free patch version of it. A manual run only keeps the
# files as artifacts of the run.
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Choose the version to release
        id: version
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          # package.json names the major and minor version; the patch number rises past every release of that pair.
          released="$(git ls-remote --tags --refs origin 'refs/tags/v*' | sed 's#.*refs/tags/v##')"
          version="$(RELEASED="$released" node -e '
            const [major, minor, patch] = require("./package.json").version.split(".").map(Number)
            const patches = process.env.RELEASED.split(/\s+/)
              .map((tag) => /^(\d+)\.(\d+)\.(\d+)$/.exec(tag))
              .filter((match) => match && Number(match[1]) === major && Number(match[2]) === minor)
              .map((match) => Number(match[3]))
            console.log([major, minor, Math.max(patch, ...patches.map((released) => released + 1))].join("."))
          ')"
          # The files are named after this version; the change is not committed.
          npm version "$version" --no-git-tag-version --allow-same-version
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm run build
      - run: npm run build:student
      - run: npx electron-builder --win portable nsis --x64 --config electron-builder.admin.json --publish never
      - run: npx electron-builder --win portable nsis --x64 --config electron-builder.student.json --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: virtual-optics-lab-windows
          path: |
            release/teacher/*.exe
            release/student/*.exe
          if-no-files-found: error
      - name: Publish the release
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          cat > notes.md <<'NOTES'
          For 64-bit Windows 10 and 11.

          | Edition | Installer | Single file, no installation |
          | --- | --- | --- |
          | **Teacher**: the laboratory, writing exams, the classroom, marking | `VirtualOpticsLab-Teacher-…-setup.exe` | `VirtualOpticsLab-Teacher-…-portable.exe` |
          | **Student**: the laboratory, joining and sitting exams | `VirtualOpticsLab-Student-…-setup.exe` | `VirtualOpticsLab-Student-…-portable.exe` |

          The installer needs no administrator rights and lets exam files be opened by double-clicking them. The files are not code-signed, so Windows SmartScreen asks for confirmation on first launch (*More info → Run anyway*).
          NOTES
          # Creates the tag on the commit that was built.
          gh release create "$TAG" release/teacher/*.exe release/student/*.exe --target "$GITHUB_SHA" --title "Virtual Optics Lab ${TAG#v}" --notes-file notes.md --generate-notes
